[profile.default]
src = "src"
test = "test"
out = "out"
libs = ["lib"]
remappings = [
  "forge-std/=lib/forge-std/src/",
  "erc721a/=lib/ERC721A/contracts/",
  "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
  # Limit Break's ERC721-C (Spinners): the library imports ERC721A as erc721a/contracts/.
  "@limitbreak/creator-token-standards/=lib/creator-token-standards/src/",
  "@limitbreak/permit-c/=lib/PermitC/src/",
  "lib/creator-token-standards/:erc721a/=lib/ERC721A/",
]
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 1000000
via_ir = true

# The USDG position venues' adapters are compiled for size: at a million runs the UP gauge adapters
# pass the 24,576-byte limit on deployed code (EIP-170), which forge's tests do not enforce but
# every chain does. They run a few times a day, so their gas matters little.
additional_compiler_profiles = [{ name = "size", optimizer_runs = 200 }]
compilation_restrictions = [{ paths = "src/positions/adapters/**", optimizer_runs = 200 }]
# test/positions/CodeSize.t.sol reads the built artifacts, as the deploy script does.
fs_permissions = [{ access = "read", path = "./out" }]

# OFF, against forge's 1.8 default, to keep the deploy log readable.
#
# With it on, forge preprocesses tests that deploy contracts with `new` into a
# temporary `foundry-pp/` directory, compiles helpers out of it, then removes
# the directory — but the compiled artifact keeps `foundry-pp/DeployHelper32.sol`
# in its metadata as a source path. Every later build then scans artifacts,
# finds a source that no longer exists, and prints
#
#   Warning: Detected artifacts built from source files that no longer exist.
#   Run `forge clean` to make sure builds are in sync with project files.
#
# The advice in that warning does not work: `forge clean` removes the artifact,
# the next build regenerates it, and the warning returns. Ours came from
# a fork test that deployed contracts with `new`.
#
# It is only noise, but noise in a deploy log can stop someone mid-deploy.
#
# Turning it off costs nothing measurable here: cold build 10.97s vs 10.78s,
# and an incremental build after touching a test 0.141s vs 0.142s. The feature
# speeds up relinking in suites far more test-heavy than this one.
dynamic_test_linking = false

# forge-std is required for the tests and is NOT vendored — lib/ is
# gitignored. Fetch it with:
#
#   npm run setup
#
# which pins the version in package.json rather than leaving it to whatever
# `forge install` resolves on the day. Run the same script in CI, so a suite
# that passes on a laptop is running against the same forge-std as the one
# that gates a merge. A plain `git clone` rather than `forge install`
# because lib/ is ignored: a submodule would need a .gitmodules entry
# contradicting that, and the clone does not depend on forge's install
# behaviour staying put across releases.
